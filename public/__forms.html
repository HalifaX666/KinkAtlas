<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>KinkAtlas forms</title></head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="contact">
      <input name="name" type="text" autocomplete="name">
      <input name="email" type="email" autocomplete="email">
      <select name="topic">
        <option value="General question or feedback">General question or feedback</option>
        <option value="Bug report">Bug report</option>
        <option value="Accessibility">Accessibility</option>
        <option value="Privacy">Privacy</option>
        <option value="Press / collaboration">Press / collaboration</option>
      </select>
      <textarea name="message"></textarea>
      <input name="website" type="text">
    </form>
  </body>
</html>
