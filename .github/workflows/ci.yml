name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint TypeScript and JavaScript
        run: npm run lint

      - name: Check CSS and design tokens
        run: npm run styles:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Check role-library drift
        run: npm run role-library:check

      - name: Build production bundle
        run: npm run build

      - name: Run calibration suite
        run: npm run calibrate

      - name: Enforce production source boundary
        run: npm run production-boundary

      - name: Verify public self-containment
        run: npm run public-self-containment

      - name: Scan public file surface
        run: npm run public-surface:check

      - name: Scan public file surface for secrets
        run: npm run secrets:check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser validation
        run: npm run test:e2e:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
